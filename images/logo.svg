<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="100%" height="100%">
  <defs>
    <!-- Soft warm amber glow behind the window -->
    <radialGradient id="vkGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#e58925" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b35900" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Warm amber pane gradient -->
    <linearGradient id="vkAmberPane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd580"/>
      <stop offset="50%" stop-color="#f09930"/>
      <stop offset="100%" stop-color="#c96f12"/>
    </linearGradient>

    <!-- Glass gloss reflection -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ===================================================
       TWO-SASH WINDOW: Exactly framing the letters 'В' and 'к'
       Left sash corresponds to 'В', right sash to 'к'
       =================================================== -->
  <g id="window-vk-lockup" transform="translate(15, 20)">
    <!-- Ambient orange halo glow -->
    <rect x="-10" y="-10" width="160" height="135" rx="16" fill="url(#vkGlow)" filter="url(#softBlur)"/>

    <!-- Outer Window Frame / Общая рама окна -->
    <rect x="0" y="0" width="140" height="115" rx="4" fill="#141922" stroke="#e5912c" stroke-width="3"/>
    <rect x="5" y="5" width="130" height="105" rx="2" fill="#0d1117"/>

    <!-- LEFT SASH (Левая створка под букву 'В') -->
    <rect x="10" y="10" width="56" height="95" rx="2" fill="url(#vkAmberPane)" stroke="#222a38" stroke-width="2"/>
    <polygon points="12,12 45,12 12,65" fill="url(#glassGloss)"/>

    <!-- RIGHT SASH (Правая створка под букву 'к') -->
    <rect x="74" y="10" width="56" height="95" rx="2" fill="url(#vkAmberPane)" stroke="#222a38" stroke-width="2"/>
    <polygon points="76,12 109,12 76,65" fill="url(#glassGloss)"/>

    <!-- Center Mullion / Центральный импост -->
    <line x1="70" y1="5" x2="70" y2="110" stroke="#141922" stroke-width="4"/>

    <!-- Handles / Ручки створок -->
    <rect x="63" y="54" width="3.5" height="13" rx="1.5" fill="#ffffff"/>
    <rect x="73.5" y="54" width="3.5" height="13" rx="1.5" fill="#ffffff"/>

    <!-- Window Sill / Подоконник -->
    <rect x="-6" y="112" width="152" height="7" rx="2.5" fill="#e5912c"/>
  </g>

  <!-- ===================================================
       TYPOGRAPHY: 'стройгруппа Вкомфорте'
       =================================================== -->
  <g id="typography">
    <!-- Top Line: 'стройгруппа' positioned neatly above 'комфорте' -->
    <text x="175" y="44" 
          font-family="'Caveat', 'Segoe Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="34" 
          font-weight="700" 
          font-style="italic" 
          letter-spacing="2.5" 
          fill="#e59934">стройгруппа</text>

    <!-- Letter 'В' — aligned inside/over the Left Sash -->
    <text x="32" y="112" 
          font-family="'Caveat', 'Segoe Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="78" 
          font-weight="900" 
          font-style="italic" 
          fill="#10141b" 
          stroke="#ffffff" 
          stroke-width="1.2">В</text>

    <!-- Letter 'к' — aligned inside/over the Right Sash -->
    <text x="96" y="110" 
          font-family="'Caveat', 'Segoe Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="72" 
          font-weight="900" 
          font-style="italic" 
          fill="#10141b" 
          stroke="#ffffff" 
          stroke-width="1.2">к</text>

    <!-- Rest of the word 'омфорте' — flowing seamlessly to the right -->
    <text x="165" y="112" 
          font-family="'Caveat', 'Segoe Script', 'Brush Script MT', cursive, sans-serif" 
          font-size="72" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="1" 
          fill="#ffffff">омфорте</text>
  </g>
</svg>
